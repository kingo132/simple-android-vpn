# SimpleVPN server configuration (reactor engine options + vpn_* plugin options)
# Start:  mulserver conf/server.ini [path/to/libvpnproxy.so]

# ---------------- engine ----------------
log_dir = ./log
# 0 emerg 1 alert 2 crit 3 error 4 warn 5 notice 6 info 7 debug 8 trace
log_level = 6
log_size = 104857600
log_maxfiles = 10
# 1 terminal, 2 file, 3 both
log_dest = 3
# foreground | background
run_mode = foreground
#pid_file = ./simplevpn.pid
worker_num = 4
bind_file = ./conf/bind.txt
dll_file = ./libvpnproxy.so

# One tunnel frame carries one IP packet (<= 64 KB + header)
max_packet_size = 131072
ringqueue_length = 16777216
send_queue_length = 33554432
# Unsent data per connection. Tunnel frames are dropped (not the connection
# closed) when a slow phone falls this far behind.
send_buffer_max = 33554432
send_high_watermark = 1048576
send_overflow_policy = drop
connect_timeout_ms = 10000
max_connections = 100000
timer_interval_ms = 50

# ---------------- VPN plugin ----------------
# Shared secret; the app / client must send the same token. Empty = no auth.
vpn_token = change-me

# Log a one line summary of every IP packet in both directions (very verbose)
vpn_log_packets = 0
# Hex dump the first N bytes of every TCP chunk / UDP datagram (0 = off)
vpn_log_payload_bytes = 0
# Write every session to <dir>/session-<id>-<time>.pcap (open with Wireshark)
vpn_pcap_dir = ./pcap
vpn_pcap_max_mb = 100

# Block domains (and their sub domains): DNS gets NXDOMAIN, TLS SNI / HTTP Host gets a RST
#vpn_block_domains = example.org,ads.example.com

# Rewrite rules for plaintext TCP streams on vpn_rewrite_ports:
#   vpn_rewrite_N = up|<from>|<to>     phone -> server
#   vpn_rewrite_N = down|<from>|<to>   server -> phone
# \r \n \t \| \\ escapes are supported. Keep lengths equal when touching HTTP bodies
# (Content-Length!).
#vpn_rewrite_1 = up|User-Agent: curl|User-Agent: SimpleVPN
#vpn_rewrite_2 = down|Example Domain|Hacked! Domain
vpn_rewrite_ports = 80

# Refuse connections to loopback / private addresses of the server's network
vpn_block_private = 0
# Reject QUIC (UDP 443) so browsers / apps fall back to TCP + TLS, where the
# TLS SNI and plain HTTP are visible to the inspector
vpn_block_quic = 0

# Timeouts (seconds)
vpn_tcp_idle_timeout = 3600
vpn_tcp_half_close_timeout = 120
vpn_udp_idle_timeout = 120
vpn_dns_idle_timeout = 20
vpn_icmp_idle_timeout = 30
vpn_max_flows = 4096
# Receive window advertised to the phone and per flow download buffer (bytes)
vpn_tcp_window = 524288
vpn_tcp_flow_buffer = 1048576
# Bytes sent to the phone but not yet acknowledged, for all flows of a tunnel
vpn_session_inflight = 4194304
vpn_stats_interval = 60
